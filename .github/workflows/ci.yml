name: Workflow quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-and-render:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: ${{ matrix.python }}
      - name: Install render tools and multilingual font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Audit portable package
        run: python scripts/audit_repository.py --history
      - name: Unit and actual encode integration tests
        env:
          REQUIRE_MEDIA_TESTS: '1'
        run: python -m unittest discover -s tests -v
